name: Build

# Builds and checks ffmpeg-lite on pushes to main and staging, and on pull requests.
#
# To release a version: change the version in package/package.json (and CHANGELOG.md) in a pull
# request, release it to main, then run this workflow by hand on main with "publish" ticked. It
# publishes @matterandmotion/ffmpeg-lite to npm (trusted publishing, with provenance) and creates
# the v<version> GitHub release with the complete source. If that version is already on npm (e.g.
# one published by hand), only the release is made.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and create the GitHub release (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install ffmpeg (makes the test clips)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build
        run: ./build.sh all
      - name: Check
        run: node test/smoke.mjs
      - name: Package
        id: package
        run: |
          version=$(node -p "require('./package/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp README.md LICENSE package/
          (cd package && npm pack --pack-destination ../work)
          ./source.sh "$version"
          (cd package && sha256sum st/* mt/*) | tee work/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lite
          path: |
            work/*.tgz
            work/*-source.tar.gz
            work/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-lite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11 && npm --version
      - name: Publish to npm
        run: |
          if npm view "@matterandmotion/ffmpeg-lite@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm; not publishing it again."
          else
            npm publish "./matterandmotion-ffmpeg-lite-$VERSION.tgz" --access public
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ffmpeg-lite $VERSION" \
            --notes "@matterandmotion/ffmpeg-lite $VERSION. What's in it: see CHANGELOG.md and the README at this tag. GPL-2.0-or-later; the complete source is in ffmpeg-lite-$VERSION-source.tar.gz. SHA256SUMS lists the hashes of the built files, which are reproducible." \
            ./*.tgz ./*-source.tar.gz ./SHA256SUMS
